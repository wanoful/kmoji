name: Build and integration tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git cmake ninja fcitx5 qt6-base python python-gobject dbus
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr && cmake --build build -j2
      - name: Test
        run: python tests/integration.py
